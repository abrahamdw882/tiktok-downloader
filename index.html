<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
</head>
<body>

    <div>
        <h2>TikTok Video and Music Downloader</h2>
        <p>Paste any TikTok video URL</p>

        <div>
            <input type="text" id="tiktokUrl" placeholder="https://vt.tiktok.com/ZSUMvWufM/" size="50" value="https://vt.tiktok.com/ZSUMvWufM/">
            <button id="fetchBtn">Load</button>
        </div>

        <div id="statusArea">
            <span id="statusMessage">paste URL and click Load</span>
        </div>

        <div id="resultContainer" style="display: none;">
            <hr>
            <div>
                <img id="videoThumb" src="" alt="thumbnail" style="max-width:320px; max-height:240px;">
                <h3 id="videoTitle">title</h3>
            </div>

            <div>
                <a id="downloadVideo" href="#" target="_blank">Download Video (MP4)</a>
                <span> | </span>
                <a id="downloadAudio" href="#" target="_blank">Download Audio (MP3)</a>
            </div>

            <div>
                <p>
                    Likes: <span id="likeCount">-</span> &nbsp;|&nbsp;
                    Comments: <span id="commentCount">-</span> &nbsp;|&nbsp;
                    Shares: <span id="shareCount">-</span> &nbsp;|&nbsp;
                    Views: <span id="playCount">-</span>
                </p>
            </div>
            <hr>
            <span>data from API</span>
        </div>

        <hr>
        <small>pure HTML and JavaScript</small>
    </div>

    <script>
        (function() {
            "use strict";

            var urlInput = document.getElementById('tiktokUrl');
            var fetchBtn = document.getElementById('fetchBtn');
            var statusMsg = document.getElementById('statusMessage');

            var resultContainer = document.getElementById('resultContainer');
            var videoThumb = document.getElementById('videoThumb');
            var videoTitle = document.getElementById('videoTitle');
            var downloadVideo = document.getElementById('downloadVideo');
            var downloadAudio = document.getElementById('downloadAudio');
            var likeSpan = document.getElementById('likeCount');
            var commentSpan = document.getElementById('commentCount');
            var shareSpan = document.getElementById('shareCount');
            var playSpan = document.getElementById('playCount');

            function setStatus(text) {
                statusMsg.textContent = text;
            }

            function clearResult() {
                resultContainer.style.display = 'none';
                videoThumb.src = '';
                videoTitle.textContent = '';
                downloadVideo.href = '#';
                downloadAudio.href = '#';
                likeSpan.textContent = '-';
                commentSpan.textContent = '-';
                shareSpan.textContent = '-';
                playSpan.textContent = '-';
            }

            function showResult(data) {
                var videoUrl = data.mp4 || data.mp4_hd || '';
                var audioUrl = data.mp3 || '';
                var thumb = data.thumbnail || '';
                var title = data.title || 'TikTok video';

                if (!videoUrl) {
                    setStatus('No video URL in response');
                    clearResult();
                    return;
                }

                videoThumb.src = thumb;
                videoThumb.alt = title;
                videoTitle.textContent = title;

                downloadVideo.href = videoUrl;
                downloadVideo.download = '';

                if (audioUrl) {
                    downloadAudio.href = audioUrl;
                    downloadAudio.style.display = 'inline';
                } else {
                    downloadAudio.style.display = 'none';
                }

                var likes = data.likeCount || data.diggCount || data.stats?.diggCount || '-';
                var comments = data.commentCount || data.stats?.commentCount || '-';
                var shares = data.shareCount || data.stats?.shareCount || '-';
                var plays = data.playCount || data.stats?.playCount || data.views || '-';

                likeSpan.textContent = likes;
                commentSpan.textContent = comments;
                shareSpan.textContent = shares;
                playSpan.textContent = plays;

                resultContainer.style.display = 'block';
                setStatus('loaded successfully');
            }

            async function fetchTikTokData() {
                var rawUrl = urlInput.value.trim();
                if (!rawUrl) {
                    setStatus('Please paste a TikTok URL');
                    clearResult();
                    return;
                }

                if (!rawUrl.includes('tiktok.com') && !rawUrl.includes('vt.tiktok')) {
                    setStatus('Invalid TikTok URL');
                    clearResult();
                    return;
                }

                var encoded = encodeURIComponent(rawUrl);
                var apiEndpoint = 'https://eliteprotech-apis.zone.id/tiktok?url=' + encoded;

                fetchBtn.disabled = true;
                setStatus('fetching ...');
                clearResult();

                try {
                    var response = await fetch(apiEndpoint);
                    if (!response.ok) {
                        var errText = 'HTTP ' + response.status;
                        try {
                            var errJson = await response.json();
                            errText = errJson.message || errJson.error || errText;
                        } catch (_) {}
                        throw new Error('Server error: ' + errText);
                    }

                    var data = await response.json();

                    if (data.success === false) {
                        throw new Error(data.message || 'API returned error');
                    }

                    if (!data.mp4 && !data.mp4_hd) {
                        throw new Error('No video media found');
                    }

                    showResult(data);
                } catch (err) {
                    console.error('Fetch error:', err);
                    setStatus('Error: ' + (err.message || 'Request failed'));
                    clearResult();
                } finally {
                    fetchBtn.disabled = false;
                }
            }

            fetchBtn.addEventListener('click', fetchTikTokData);

            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    fetchBtn.click();
                }
            });
        })();
    </script>

</body>
	</html>
