<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader</title>
</head>
<body>

    <div>
        <h2>Video & Audio Downloader</h2>
        <p>Paste TikTok or Instagram URL</p>

        <div>
            <input type="text" id="mediaUrl" placeholder="https://vt.tiktok.com/... or https://www.instagram.com/reel/..." size="50" value="https://vt.tiktok.com/ZSUMvWufM/">
            <button id="fetchBtn">Load</button>
        </div>

        <div id="statusArea">
            <span id="statusMessage">paste URL and click Load</span>
        </div>

        <div id="resultContainer" style="display: none;">
            <hr>
            <div>
                <img id="videoThumb" src="" alt="thumbnail" style="max-width:320px; max-height:240px;">
                <h3 id="videoTitle">title</h3>
            </div>

            <div>
                <a id="downloadVideo" href="#" target="_blank">Download Video (MP4)</a>
                <span> | </span>
                <a id="downloadAudio" href="#" target="_blank">Download Audio (MP3)</a>
            </div>

            <div>
                <p>
                    Likes: <span id="likeCount">-</span> &nbsp;|&nbsp;
                    Comments: <span id="commentCount">-</span> &nbsp;|&nbsp;
                    Shares: <span id="shareCount">-</span> &nbsp;|&nbsp;
                    Views: <span id="playCount">-</span>
                </p>
            </div>
            <hr>
            <span id="sourceLabel">source</span>
        </div>

        <hr>
        <small>download and enjoy</small>
    </div>

    <script>
        (function() {
            "use strict";

            var urlInput = document.getElementById('mediaUrl');
            var fetchBtn = document.getElementById('fetchBtn');
            var statusMsg = document.getElementById('statusMessage');

            var resultContainer = document.getElementById('resultContainer');
            var videoThumb = document.getElementById('videoThumb');
            var videoTitle = document.getElementById('videoTitle');
            var downloadVideo = document.getElementById('downloadVideo');
            var downloadAudio = document.getElementById('downloadAudio');
            var likeSpan = document.getElementById('likeCount');
            var commentSpan = document.getElementById('commentCount');
            var shareSpan = document.getElementById('shareCount');
            var playSpan = document.getElementById('playCount');
            var sourceLabel = document.getElementById('sourceLabel');

            function setStatus(text) {
                statusMsg.textContent = text;
            }

            function clearResult() {
                resultContainer.style.display = 'none';
                videoThumb.src = '';
                videoTitle.textContent = '';
                downloadVideo.href = '#';
                downloadAudio.href = '#';
                likeSpan.textContent = '-';
                commentSpan.textContent = '-';
                shareSpan.textContent = '-';
                playSpan.textContent = '-';
                sourceLabel.textContent = '';
            }

            function showResult(data, platform) {
                var videoUrl = data.mp4 || data.mp4_hd || data.video || '';
                var audioUrl = data.mp3 || data.audio || '';
                var thumb = data.thumbnail || data.cover || '';
                var title = data.title || data.desc || 'Media';

                if (!videoUrl) {
                    setStatus('No video URL in response');
                    clearResult();
                    return;
                }

                videoThumb.src = thumb;
                videoThumb.alt = title;
                videoTitle.textContent = title;

                downloadVideo.href = videoUrl;
                downloadVideo.download = '';

                if (audioUrl) {
                    downloadAudio.href = audioUrl;
                    downloadAudio.style.display = 'inline';
                } else {
                    downloadAudio.style.display = 'none';
                }

                var likes = data.likeCount || data.diggCount || data.stats?.diggCount || data.likes || '-';
                var comments = data.commentCount || data.stats?.commentCount || data.comments || '-';
                var shares = data.shareCount || data.stats?.shareCount || data.shares || '-';
                var plays = data.playCount || data.stats?.playCount || data.views || data.viewCount || '-';

                likeSpan.textContent = likes;
                commentSpan.textContent = comments;
                shareSpan.textContent = shares;
                playSpan.textContent = plays;

                sourceLabel.textContent = platform || 'unknown';
                resultContainer.style.display = 'block';
                setStatus('loaded successfully');
            }

            async function fetchMedia() {
                var rawUrl = urlInput.value.trim();
                if (!rawUrl) {
                    setStatus('Please paste a URL');
                    clearResult();
                    return;
                }

                var isTikTok = rawUrl.includes('tiktok.com') || rawUrl.includes('vt.tiktok');
                var isInstagram = rawUrl.includes('instagram.com') || rawUrl.includes('instagr.am');

                if (!isTikTok && !isInstagram) {
                    setStatus('Only TikTok or Instagram links supported');
                    clearResult();
                    return;
                }

                var encoded = encodeURIComponent(rawUrl);
                var apiEndpoint = '';
                var platform = '';

                if (isTikTok) {
                    apiEndpoint = 'https://eliteprotech-apis.zone.id/tiktok?url=' + encoded;
                    platform = 'TikTok';
                } else if (isInstagram) {
                    apiEndpoint = 'https://eliteprotech-apis.zone.id/instagram?url=' + encoded;
                    platform = 'Instagram';
                }

                fetchBtn.disabled = true;
                setStatus('fetching ...');
                clearResult();

                try {
                    var response = await fetch(apiEndpoint);
                    if (!response.ok) {
                        var errText = 'HTTP ' + response.status;
                        try {
                            var errJson = await response.json();
                            errText = errJson.message || errJson.error || errText;
                        } catch (_) {}
                        throw new Error('Server error: ' + errText);
                    }

                    var data = await response.json();

                    if (data.success === false) {
                        throw new Error(data.message || 'API returned error');
                    }

                    var mediaData = data;
                    if (platform === 'Instagram' && data.data) {
                        mediaData = data.data;
                    } else if (platform === 'Instagram' && data.graphql?.shortcode_media) {
                        var node = data.graphql.shortcode_media;
                        mediaData = {
                            mp4: node.video_url || node.videoUrl || '',
                            thumbnail: node.thumbnail_src || node.display_url || '',
                            title: node.edge_media_to_caption?.edges?.[0]?.node?.text || 'Instagram reel',
                            likeCount: node.edge_media_preview_like?.count || node.like_count || 0,
                            commentCount: node.edge_media_to_comment?.count || node.comment_count || 0,
                            playCount: node.video_view_count || node.play_count || 0,
                            shareCount: node.edge_media_to_share?.count || node.share_count || 0,
                        };
                    }

                    if (!mediaData.mp4 && data.mp4) mediaData.mp4 = data.mp4;
                    if (!mediaData.mp4 && data.mp4_hd) mediaData.mp4 = data.mp4_hd;
                    if (!mediaData.thumbnail && data.thumbnail) mediaData.thumbnail = data.thumbnail;

                    if (!mediaData.mp4 && !mediaData.video) {
                        throw new Error('No video media found');
                    }

                    var normalized = {
                        mp4: mediaData.mp4 || mediaData.video || mediaData.video_url || '',
                        mp3: mediaData.mp3 || mediaData.audio || mediaData.music || '',
                        thumbnail: mediaData.thumbnail || mediaData.cover || mediaData.thumb || '',
                        title: mediaData.title || mediaData.desc || mediaData.caption || 'Media',
                        likeCount: mediaData.likeCount ?? mediaData.diggCount ?? mediaData.like_count ?? mediaData.likes ?? 0,
                        commentCount: mediaData.commentCount ?? mediaData.comment_count ?? mediaData.comments ?? 0,
                        shareCount: mediaData.shareCount ?? mediaData.share_count ?? mediaData.shares ?? 0,
                        playCount: mediaData.playCount ?? mediaData.play_count ?? mediaData.views ?? mediaData.viewCount ?? 0,
                    };

                    showResult(normalized, platform);
                } catch (err) {
                    console.error('Fetch error:', err);
                    setStatus('Error: ' + (err.message || 'Request failed'));
                    clearResult();
                } finally {
                    fetchBtn.disabled = false;
                }
            }

            fetchBtn.addEventListener('click', fetchMedia);
            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    fetchBtn.click();
                }
            });
        })();
    </script>

</body>
	</html>
